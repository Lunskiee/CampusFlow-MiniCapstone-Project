<div class="auth-wrapper">
  <div class="form-side">
    <div class="brand">
      <img src="/assets/cf-logo.png" alt="Logo">
      <span class="brand-name">CampusFlow</span>
    </div>

    <div class="form-container">
      <h2 class="title">Create <span class="highlight">Account</span></h2>
      
      <!-- Inline Error Banner -->
      <div *ngIf="errorMessage" 
           style="background-color: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; margin-bottom: 15px; text-align: center;">
        {{ errorMessage }}
      </div>

      <form #registerForm="ngForm">
        <div class="input-field">
          <input 
            type="text" 
            name="firstName" 
            [(ngModel)]="userData.firstName" 
            (input)="errorMessage = ''"
            placeholder="Enter First Name" 
            required>
        </div>

        <div class="input-field">
          <input 
            type="text" 
            name="lastName" 
            [(ngModel)]="userData.lastName" 
            (input)="errorMessage = ''"
            placeholder="Enter Last Name" 
            required>
        </div>

        <div class="input-field">
          <input 
            type="email" 
            name="email" 
            [(ngModel)]="userData.email" 
            (input)="errorMessage = ''"
            placeholder="Enter Email" 
            required>
        </div>

        <div class="input-field">
          <div style="position: relative; display: flex; align-items: center;">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              name="password" 
              [(ngModel)]="userData.password" 
              (input)="errorMessage = ''"
              placeholder="Enter Password" 
              style="width: 100%;"
              required>
            <span (click)="showPassword = !showPassword" 
                  style="position: absolute; right: 12px; cursor: pointer; user-select: none;">
              {{ showPassword ? '👁️' : '🙈' }}
            </span>
          </div>
        </div>

        <button type="button" class="btn-save-3d" (click)="onCreateAccount()">
          Create Account
        </button>

        <p class="login-link">
          Already have an account? <a routerLink="/login">Login</a>
        </p>
      </form>
    </div>
  </div>

  <div class="image-side"></div>
</div>
